<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body>
<script src="./sap-signer.js"></script>
<script>
window.sapSignOnce = (guid, optionsJson, bodyB64) => {
  const cleanup = () => sapClose().catch(function () {});
  const stage = (name, promise) => promise.catch(function (e) {
    throw new Error(name + ": " + (e && e.message ? e.message : e));
  });

  return cleanup()
    .then(function () {
      let options = {};
      try { options = JSON.parse(optionsJson || "{}"); } catch (_e) {}
      return stage("init", sapInitialize(guid, options));
    })
    .then(function () {
      return stage("sign", sapSign(bodyB64));
    })
    .then(function (signature) {
      return cleanup().then(function () { return signature; });
    }, function (err) {
      return cleanup().then(function () { throw err; });
    });
};

window.sapInitAsync = (guid, optionsJson) => {
  let options = {};
  try { options = JSON.parse(optionsJson || "{}"); } catch (_e) {}
  return sapInitialize(guid, options).then(function () { return "ok"; });
};
window.sapSignAsync = (bodyB64) => sapSign(bodyB64);
window.sapCloseAsync = () => sapClose().then(function () { return "ok"; });
</script>
</body>
</html>
